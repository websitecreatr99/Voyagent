services:
  - type: web
    name: voyagent-backend
    runtime: python
    plan: free
    branch: backend

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn server:api --host 0.0.0.0 --port $PORT

    healthCheckPath: /api/health

    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      # Canned responses until real keys are added. Set to "false" once
      # GROQ_API_KEY, TAVILY_API_KEY, AVIATION_STACK_API_KEY and OPENWEATHER_API_KEY are set.
      - key: MOCK_MODE
        value: "true"
      # Comma-separated list of allowed frontend origins (your Vercel URL).
      - key: FRONTEND_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: AVIATION_STACK_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
